<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="global.css">
	<link rel="stylesheet" href="login.css">
	<title>Login</title>
</head>
<body>
	<main>
		<section id="login" class="login">
			<form>
				<div class = "box">					
					<h1 class = "title">Login</h1>
					<div class="inserir">
    					<label for="email" class="sr-only"></label>
    					<input id="email" name="email" type="email" placeholder="Email" autocomplete="email" required>
					</div>
					<div class="inserir">
						<label for="password" class="sr-only"></label>
						<input id="password" name="password" type="password" placeholder="Senha" autocomplete="current-password" required>
					</div>
					<button type="submit">Entrar</button>
					<a href="cadastro.html" class="link-cadastro">Não tem uma conta? Cadastre-se</a>
				</div>
			</form>
		</section>
	</main>
</body>
</html>
